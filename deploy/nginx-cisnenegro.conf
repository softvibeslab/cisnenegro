# /etc/nginx/sites-available/cisnenegro.softvibes.art
server {
    listen 80;
    listen [::]:80;
    server_name cisnenegro.softvibes.art;
    root /var/www/cisnenegro;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /data/ {
        expires 5m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Panel del personal y su API: usuario y contraseña
    location /admin/ {
        auth_basic "Cisne Negro - Equipo";
        auth_basic_user_file /etc/nginx/.htpasswd-cisnenegro;
        try_files $uri $uri/ =404;
    }
    location /api/admin/ {
        auth_basic "Cisne Negro - Equipo";
        auth_basic_user_file /etc/nginx/.htpasswd-cisnenegro;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_except GET POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }
}

# Include inside the existing HTTPS server block. Preserve other site routes.
location = /cms { return 308 /cms/; }
location ^~ /cms/ {
    client_max_body_size 105m;
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:8795;
    include /etc/nginx/snippets/cisnenegro-cms-proxy.conf;
}
location = / { proxy_pass http://127.0.0.1:8795; include /etc/nginx/snippets/cisnenegro-cms-proxy.conf; }
location = /index.html { proxy_pass http://127.0.0.1:8795; include /etc/nginx/snippets/cisnenegro-cms-proxy.conf; }
location = /menu { return 308 /menu/; }
location = /menu/ { proxy_pass http://127.0.0.1:8795; include /etc/nginx/snippets/cisnenegro-cms-proxy.conf; }
location = /menu/index.html { proxy_pass http://127.0.0.1:8795; include /etc/nginx/snippets/cisnenegro-cms-proxy.conf; }
location = /data/menu.json { proxy_pass http://127.0.0.1:8795; include /etc/nginx/snippets/cisnenegro-cms-proxy.conf; }
location = /_cisne_cms_owner {
    internal;
    proxy_pass http://127.0.0.1:8795/cms/auth/owner;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    include /etc/nginx/snippets/cisnenegro-cms-proxy.conf;
}
location = /admin { return 308 /admin/; }
location /admin/ {
    auth_request /_cisne_cms_owner;
    error_page 401 = @cisne_cms_login;
    try_files $uri $uri/ =404;
}
location @cisne_cms_login { return 302 /cms/?next=/admin/; }
location /api/admin/ {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8795;
    include /etc/nginx/snippets/cisnenegro-cms-proxy.conf;
}

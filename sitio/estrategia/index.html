<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0e0d0b">
  <title>Cisne Negro · Estrategia de contenido</title>
  <meta name="description" content="Tablero de solo lectura del piloto de contenido de Cervecería Cisne Negro: calendario, parrilla, matriz, temporada y laboratorio.">
  <link rel="icon" href="/assets/img/marca/favicon-192.png">
  <link rel="stylesheet" href="estrategia.css">
  <script src="estrategia.js" defer></script>
</head>
<body>
  <a class="skip" href="#vista">Saltar al contenido</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Secciones del tablero">
      <a class="brand" href="#inicio"><img src="/assets/img/marca/pluma.png" alt="" width="24" height="48"><span>CISNE NEGRO<small>Estrategia de contenido</small></span></a>
      <p class="nav-label">Tablero</p>
      <nav id="nav" aria-label="Vistas"></nav>
      <div class="sidebar-bottom">
        <p class="fuente" id="fuente" role="status">Cargando datos…</p>
        <p class="fine">Solo lectura. Las piezas se editan y aprueban en el CMS.</p>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" hidden aria-label="Cerrar navegación"></button>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Abrir navegación" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div><p class="eyebrow" id="migas">Piloto de temporada</p><h1 class="topbar-title" id="titulo-vista">Inicio</h1></div>
        </div>
        <div class="topbar-actions">
          <button class="button small secondary" id="filtros-toggle" aria-controls="filtros" aria-expanded="false">Filtros <span class="count" id="filtros-count"></span></button>
          <button class="button small primary" id="presentar">Presentar <span aria-hidden="true">▶</span></button>
        </div>
      </header>
      <section class="filtros" id="filtros" aria-label="Filtros" hidden>
        <div class="filtros-redes" id="filtro-redes" role="group" aria-label="Redes"></div>
        <div class="filtros-campos">
          <label class="sr-only" for="filtro-pilar">Pilar</label>
          <select id="filtro-pilar"><option value="">Todos los pilares</option></select>
          <label class="sr-only" for="filtro-campana">Festividad</label>
          <select id="filtro-campana"><option value="">Todas las fechas</option></select>
          <label class="sr-only" for="filtro-q">Buscar</label>
          <input id="filtro-q" type="search" placeholder="Buscar pieza, cerveza o platillo" autocomplete="off">
          <button class="button small ghost" id="filtros-limpiar" type="button">Limpiar</button>
        </div>
      </section>
      <main id="vista" class="vista" tabindex="-1" aria-live="polite">
        <div class="cargando"><span class="spinner" aria-hidden="true"></span><p>Preparando el tablero…</p></div>
      </main>
      <footer class="pie"><span>CISNE NEGRO · PACHUCA</span><span>¡Cuéntalo en el Cisne!</span></footer>
    </div>
  </div>

  <dialog id="pieza" class="pieza-dialog" aria-labelledby="pieza-titulo"></dialog>

  <div class="presentacion-controles" id="presentacion-controles" hidden>
    <button class="icon-button" id="pres-prev" aria-label="Vista anterior">‹</button>
    <span id="pres-pos" class="mono" aria-live="polite"></span>
    <button class="icon-button" id="pres-next" aria-label="Vista siguiente">›</button>
    <button class="button small ghost" id="pres-salir">Salir <span class="fine">(Esc)</span></button>
  </div>
  <noscript><p class="noscript">Activa JavaScript para ver el tablero.</p></noscript>
</body>
</html>

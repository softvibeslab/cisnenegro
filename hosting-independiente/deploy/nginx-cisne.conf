# Reemplaza nginx-cisne-http.conf después de obtener el certificado.
# Usa nginx del host; NO iniciar el perfil standalone de Compose en este modo.
server {
    listen 80;
    listen [::]:80;
    server_name cisne.softvibes.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cisne-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://cisne.softvibes.art$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cisne.softvibes.art;

    ssl_certificate /etc/letsencrypt/live/cisne.softvibes.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cisne.softvibes.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 105m;
    client_body_timeout 240s;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Cisne-Staff-Token "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_request_buffering off;
    }
}

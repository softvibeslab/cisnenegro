# Bootstrap HTTP para Certbot webroot. Solo habilitar este archivo hasta tener TLS.
# No habilitar simultáneamente con nginx-cisne.conf para el mismo nombre/puerto.
server {
    listen 80;
    listen [::]:80;
    server_name cisne.softvibes.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cisne-acme;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
